<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi portal · AbyC</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="icon" type="image/png" href="../../assets/imagen-1.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/portal.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.75.0/dist/umd/supabase.min.js"></script>
<script src="../assets/config.js"></script>
<script src="../assets/portal.js"></script>
</head>
<body>
<div class="demo-banda oculto" id="demo-banda">Vista de ejemplo · así se ve el portal de un cliente</div>
<div class="top"><div class="in">
  <a class="logo" href="../../"><img src="../../assets/imagen-1.png" alt="AbyC"> ABYC</a>
  <div class="quien"><b id="cliente">Cargando…</b><span id="correo"></span></div>
  <button class="btn sec chico" id="salir" type="button">Salir</button>
</div></div>

<div class="wrap">
  <div class="tabs" role="tablist" style="margin-top:4px">
    <button class="tab" role="tab" data-t="inicio" aria-selected="true">Inicio</button>
    <button class="tab" role="tab" data-t="pendientes" aria-selected="false">Pendientes <span class="n oculto" id="n-pendientes"></span></button>
    <button class="tab" role="tab" data-t="aprobaciones" aria-selected="false">Aprobaciones <span class="n oculto" id="n-aprobaciones"></span></button>
    <button class="tab" role="tab" data-t="entregas" aria-selected="false">Envíanos material</button>
    <button class="tab" role="tab" data-t="materiales" aria-selected="false">Materiales</button>
    <button class="tab" role="tab" data-t="reportes" aria-selected="false">Reportes</button>
  </div>

  <section id="t-inicio"></section>
  <section id="t-pendientes" class="oculto"></section>
  <section id="t-aprobaciones" class="oculto"></section>
  <section id="t-entregas" class="oculto"></section>
  <section id="t-materiales" class="oculto"></section>
  <section id="t-reportes" class="oculto"></section>
</div>

<script>
const { sb, esc, fecha, mes, sesion, salir, descargar } = Portal;
const DEMO = new URLSearchParams(location.search).has('demo');
const ESTADO = { por_hacer: ['Por hacer', ''], en_proceso: ['En proceso', 'warn'], listo: ['Listo', 'ok'] };
const ICO = { instagram: ['ig', 'IG'], linkedin: ['li', 'in'], facebook: ['fb', 'f'], tiktok: ['tt', 'TT'], youtube: ['yt', 'YT'], x: ['x', 'X'] };

document.getElementById('salir').onclick = () => DEMO ? location.href = '../' : salir();

function abrirTab(nombre) {
  document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x.dataset.t === nombre));
  document.querySelectorAll('section[id^="t-"]').forEach(s => s.classList.toggle('oculto', s.id !== 't-' + nombre));
  window.scrollTo(0, 0);
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => abrirTab(t.dataset.t));

/* ---------- datos ---------- */
const hoy = new Date();
const dia = (n) => new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() + n).toISOString().slice(0, 10);
const EJEMPLO = {
  cliente: { nombre: 'Tu marca', redes: [
    { red: 'Instagram', usuario: '@tumarca', url: 'https://instagram.com/' },
    { red: 'LinkedIn', usuario: 'Tu nombre', url: 'https://linkedin.com/' },
    { red: 'TikTok', usuario: '@tumarca', url: 'https://tiktok.com/' } ] },
  nombre: 'Cliente',
  correo: 'cliente@ejemplo.com',
  pendientes: [
    { id: 'p1', titulo: 'Grabar los videos del mes', detalle: 'Sigue la guía de grabación y súbelos a la carpeta compartida.', responsable: 'cliente', estado: 'por_hacer', fecha_limite: dia(4) },
    { id: 'p2', titulo: 'Mandar 3 fotos de tu día a día', detalle: null, responsable: 'cliente', estado: 'por_hacer', fecha_limite: dia(6) },
    { id: 'p3', titulo: 'Editar videos de la semana 1', detalle: null, responsable: 'abyc', estado: 'en_proceso', fecha_limite: dia(7) },
    { id: 'p4', titulo: 'Diseñar carruseles del mes', detalle: null, responsable: 'abyc', estado: 'por_hacer', fecha_limite: dia(10) },
    { id: 'p5', titulo: 'Estrategia de marca personal', detalle: null, responsable: 'abyc', estado: 'listo', fecha_limite: dia(-3) } ],
  entregas: [
    { id: 'e1', tipo: 'fotos', url: 'https://drive.google.com/', nota: 'Fotos del evento del jueves', estado: 'recibido', creado_en: dia(-4) } ],
  piezas: [
    { id: 'a1', titulo: 'Reel: 3 errores al negociar', descripcion: 'Texto del post: Negociar bien no es ganar…', ruta: 'demo', fecha_publicacion: dia(3), estado: 'pendiente' },
    { id: 'a2', titulo: 'Carrusel: checklist de investigación interna', descripcion: null, ruta: 'demo', fecha_publicacion: dia(5), estado: 'pendiente' },
    { id: 'a3', titulo: 'Post de bienvenida', descripcion: null, ruta: 'demo', fecha_publicacion: dia(-1), estado: 'aprobada', respondido_en: dia(-2) } ],
  archivos: [
    { id: 'f1', tipo: 'material', titulo: 'Estrategia de marca personal (PDF)', descripcion: 'Posicionamiento, voz, pilares e identidad.', ruta: 'demo', creado_en: dia(-3) },
    { id: 'f2', tipo: 'material', titulo: 'Guiones del mes 1', descripcion: '7 guiones con guía de grabación.', ruta: 'demo', creado_en: dia(-2) },
    { id: 'f3', tipo: 'reporte', titulo: 'Reporte', ruta: 'demo', mes: dia(-25).slice(0, 8) + '01', creado_en: dia(-1) } ]
};

async function obtener() {
  if (DEMO) return window.EJEMPLO_PORTAL || EJEMPLO;
  const S = await sesion();
  if (!S) return null;
  if (S.perfil.rol === 'admin') {
    document.querySelector('.top .in').insertAdjacentHTML('beforeend', '<a class="btn chico" href="../admin/">Panel admin</a>');
  }
  if (!S.perfil.cliente_id) return { sinCliente: true, correo: S.user.email, nombre: S.perfil.nombre };
  const [c, p, a, f, e] = await Promise.all([
    sb.from('clientes').select('nombre,redes').eq('id', S.perfil.cliente_id).single(),
    sb.from('pendientes').select('*').eq('cliente_id', S.perfil.cliente_id).order('fecha_limite', { ascending: true, nullsFirst: false }),
    sb.from('piezas').select('*').eq('cliente_id', S.perfil.cliente_id).order('creado_en', { ascending: false }),
    sb.from('archivos').select('*').eq('cliente_id', S.perfil.cliente_id).order('creado_en', { ascending: false }),
    sb.from('entregas').select('*').eq('cliente_id', S.perfil.cliente_id).order('creado_en', { ascending: false })
  ]);
  return { cliente: c.data || {}, nombre: S.perfil.nombre, correo: S.user.email,
           pendientes: p.data || [], piezas: a.data || [], archivos: f.data || [],
           entregas: e.data || [], clienteId: S.perfil.cliente_id };
}

async function cargar() {
  const D = await obtener();
  if (!D) return;
  document.getElementById('demo-banda').classList.toggle('oculto', !DEMO);
  document.getElementById('correo').textContent = D.correo || '';
  if (D.sinCliente) {
    document.getElementById('cliente').textContent = 'Sin cliente asignado';
    document.getElementById('t-inicio').innerHTML = '<div class="vacio" style="margin-top:18px">Tu cuenta todavía no está ligada a un cliente. Escríbenos y lo arreglamos.</div>';
    return;
  }
  document.getElementById('cliente').textContent = D.cliente.nombre || '';
  pintarInicio(D);
  pintarPendientes(D.pendientes);
  pintarAprobaciones(D.piezas);
  pintarArchivos(D.archivos);
  pintarEntregas(D);
}

const abrirArchivo = (ruta) => DEMO ? alert('Vista de ejemplo: aquí se descargaría el archivo.') : descargar(ruta);
function contador(id, n) { const el = document.getElementById(id); el.textContent = n; el.classList.toggle('oculto', !n); }

/* ---------- inicio ---------- */
function tarjetaRed(r) {
  const k = String(r.red || '').toLowerCase().replace(/\s|\(.*\)/g, '');
  const [cls, txt] = ICO[k] || ['web', (r.red || 'W').slice(0, 2).toUpperCase()];
  const cuerpo = `<div class="ico ${cls}">${esc(txt)}</div><div><b>${esc(r.red)}</b><span>${esc(r.usuario || r.url || '')}</span></div>`;
  return r.url ? `<a class="red" href="${esc(r.url)}" target="_blank" rel="noopener">${cuerpo}</a>` : `<div class="red">${cuerpo}</div>`;
}

function pintarInicio(D) {
  const nombre = (D.nombre || '').split(' ')[0];
  const tuyos = D.pendientes.filter(x => x.responsable === 'cliente' && x.estado !== 'listo');
  const nuestros = D.pendientes.filter(x => x.responsable === 'abyc' && x.estado !== 'listo');
  const porAprobar = D.piezas.filter(x => x.estado === 'pendiente');
  const reportes = D.archivos.filter(x => x.tipo === 'reporte').sort((a, b) => String(b.mes).localeCompare(String(a.mes)));
  const ultimo = D.archivos[0];
  const redes = Array.isArray(D.cliente.redes) ? D.cliente.redes : [];
  const linea = (x) => `<div class="item"><div class="txt"><h3>${esc(x.titulo)}</h3>
      <p class="meta">${x.fecha_limite ? 'Para el ' + fecha(x.fecha_limite) : (x.fecha_publicacion ? 'Se publicaría el ' + fecha(x.fecha_publicacion) : '')}</p></div></div>`;

  document.getElementById('t-inicio').innerHTML = `
    <div class="bienvenida">
      <div><h1>${nombre ? 'Hola, ' + esc(nombre) : 'Hola'}</h1>
      <p class="sub">Aquí ves todo lo que estamos construyendo para ${esc(D.cliente.nombre || 'tu marca')}.</p></div>
      <div class="resumen">
        <div class="dato"><b>${tuyos.length}</b><span>te tocan a ti</span></div>
        <div class="dato"><b>${porAprobar.length}</b><span>por aprobar</span></div>
        <div class="dato"><b>${nuestros.length}</b><span>en manos de AbyC</span></div>
      </div>
    </div>

    ${redes.length ? `<p class="grupo-t">Tus redes</p><div class="redes">${redes.map(tarjetaRed).join('')}</div>` : ''}

    <div class="dos-col secc">
      <div class="card"><h2>Lo que necesitamos de ti</h2>
        <div class="mini">${[...porAprobar.slice(0, 2), ...tuyos.slice(0, 3)].map(linea).join('') || '<p class="sub">Nada por ahora. ¡Vas al día!</p>'}</div>
        ${porAprobar.length ? '<button class="ir" data-ir="aprobaciones">Revisar aprobaciones →</button>' : ''}
        ${tuyos.length ? '<button class="ir" data-ir="pendientes" style="margin-left:14px">Ver mis pendientes →</button>' : ''}
        <div class="aviso-envio"><b>¿Ya grabaste tus videos o tienes fotos?</b><span>Mándanos la liga de tu Drive y empezamos a editar.</span>
        <button class="btn chico" data-ir="entregas">Envíanos material</button></div>
      </div>
      <div class="card"><h2>Lo que estamos haciendo</h2>
        <div class="mini">${nuestros.slice(0, 4).map(linea).join('') || '<p class="sub">Todo al día.</p>'}</div>
      </div>
    </div>

    ${ultimo || reportes.length ? `<div class="card secc"><h2>Lo más reciente</h2><div class="mini">
      ${reportes[0] ? `<div class="item"><div class="txt"><h3>Reporte de ${mes(reportes[0].mes)}</h3><p class="meta">Tus resultados del mes</p></div><div class="acciones"><button class="btn chico" data-d="${esc(reportes[0].ruta)}">Descargar</button></div></div>` : ''}
      ${ultimo && ultimo.tipo === 'material' ? `<div class="item"><div class="txt"><h3>${esc(ultimo.titulo)}</h3><p class="meta">Subido el ${fecha(ultimo.creado_en)}</p></div><div class="acciones"><button class="btn chico" data-d="${esc(ultimo.ruta)}">Descargar</button></div></div>` : ''}
    </div></div>` : ''}`;

  const el = document.getElementById('t-inicio');
  el.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => abrirTab(b.dataset.ir));
  el.querySelectorAll('[data-d]').forEach(b => b.onclick = () => abrirArchivo(b.dataset.d));
}

/* ---------- pendientes ---------- */
function pintarPendientes(lista) {
  const el = document.getElementById('t-pendientes');
  const abiertos = lista.filter(x => x.estado !== 'listo');
  contador('n-pendientes', abiertos.filter(x => x.responsable === 'cliente').length);
  if (!lista.length) { el.innerHTML = '<div class="vacio">No hay pendientes por ahora.</div>'; return; }
  const fila = (x) => {
    const [txt, cls] = ESTADO[x.estado];
    const tuyo = x.responsable === 'cliente';
    const boton = tuyo
      ? (x.estado === 'listo'
          ? `<button class="btn sec chico" data-p="${x.id}" data-e="por_hacer">Reabrir</button>`
          : `<button class="btn chico" data-p="${x.id}" data-e="listo">Marcar como listo</button>`)
      : '';
    return `<div class="item"><div class="txt"><h3>${esc(x.titulo)}</h3>
      ${x.detalle ? `<p class="meta">${esc(x.detalle)}</p>` : ''}
      <p class="meta">${x.fecha_limite ? 'Para el ' + fecha(x.fecha_limite) : 'Sin fecha'}</p></div>
      <div class="acciones"><span class="chip ${tuyo ? 'tu' : ''}">${tuyo ? 'Te toca a ti' : 'Lo hace AbyC'}</span>
      <span class="chip ${cls}">${txt}</span>${boton}</div></div>`;
  };
  const tuyos = abiertos.filter(x => x.responsable === 'cliente');
  const nuestros = abiertos.filter(x => x.responsable === 'abyc');
  const hechos = lista.filter(x => x.estado === 'listo');
  el.innerHTML =
    (tuyos.length ? `<p class="grupo-t">Te toca a ti</p><div class="lista">${tuyos.map(fila).join('')}</div>` : '') +
    (nuestros.length ? `<p class="grupo-t">Lo estamos haciendo nosotros</p><div class="lista">${nuestros.map(fila).join('')}</div>` : '') +
    (hechos.length ? `<p class="grupo-t">Terminados</p><div class="lista">${hechos.map(fila).join('')}</div>` : '');
  el.querySelectorAll('[data-p]').forEach(b => b.onclick = async () => {
    if (DEMO) { alert('Vista de ejemplo: aquí el cliente marca su pendiente como listo.'); return; }
    b.disabled = true;
    const { error } = await sb.rpc('marcar_pendiente', { p_id: b.dataset.p, p_estado: b.dataset.e });
    if (error) { alert('No se pudo actualizar. Intenta de nuevo.'); b.disabled = false; return; }
    cargar();
  });
}

/* ---------- aprobaciones ---------- */
function pintarAprobaciones(lista) {
  const el = document.getElementById('t-aprobaciones');
  const porRevisar = lista.filter(x => x.estado === 'pendiente');
  contador('n-aprobaciones', porRevisar.length);
  if (!lista.length) { el.innerHTML = '<div class="vacio">No hay piezas para revisar.</div>'; return; }
  const ver = (x) => x.ruta ? `<button class="btn sec chico" data-ver="${esc(x.ruta)}">Ver pieza</button>` : '';
  const pend = porRevisar.map(x => `<div class="item"><div class="txt"><h3>${esc(x.titulo)}</h3>
      ${x.descripcion ? `<p class="meta">${esc(x.descripcion)}</p>` : ''}
      <p class="meta">${x.fecha_publicacion ? 'Se publicaría el ' + fecha(x.fecha_publicacion) : ''}</p>
      <label for="c-${x.id}">Comentarios (si pides cambios, dinos cuáles)</label>
      <textarea id="c-${x.id}"></textarea></div>
      <div class="acciones">${ver(x)}
      <button class="btn chico" data-r="${x.id}" data-e="aprobada">Aprobar</button>
      <button class="btn negro chico" data-r="${x.id}" data-e="cambios">Pedir cambios</button></div></div>`).join('');
  const resp = lista.filter(x => x.estado !== 'pendiente').map(x => `<div class="item"><div class="txt"><h3>${esc(x.titulo)}</h3>
      ${x.comentario ? `<p class="meta">Tu comentario: ${esc(x.comentario)}</p>` : ''}
      <p class="meta">${x.respondido_en ? 'Respondiste el ' + fecha(x.respondido_en) : ''}</p></div>
      <div class="acciones">${ver(x)}<span class="chip ${x.estado === 'aprobada' ? 'ok' : 'bad'}">${x.estado === 'aprobada' ? 'Aprobada' : 'Pediste cambios'}</span></div></div>`).join('');
  el.innerHTML =
    (pend ? `<p class="grupo-t">Por revisar</p><div class="lista">${pend}</div>` : '') +
    (resp ? `<p class="grupo-t">Ya respondidas</p><div class="lista">${resp}</div>` : '');
  el.querySelectorAll('[data-ver]').forEach(b => b.onclick = () => abrirArchivo(b.dataset.ver));
  el.querySelectorAll('[data-r]').forEach(b => b.onclick = async () => {
    const comentario = document.getElementById('c-' + b.dataset.r).value;
    if (b.dataset.e === 'cambios' && !comentario.trim()) { alert('Cuéntanos qué cambios quieres en el cuadro de comentarios.'); return; }
    if (DEMO) { alert('Vista de ejemplo: aquí el cliente aprueba o pide cambios.'); return; }
    b.disabled = true;
    const { error } = await sb.rpc('responder_pieza', { p_id: b.dataset.r, p_estado: b.dataset.e, p_comentario: comentario });
    if (error) { alert('No se pudo enviar. Intenta de nuevo.'); b.disabled = false; return; }
    cargar();
  });
}

/* ---------- envíanos material ---------- */
const TIPO_ENTREGA = { videos: 'Videos grabados', fotos: 'Fotos', otros: 'Otros materiales' };
function pintarEntregas(D) {
  const lista = D.entregas || [];
  const el = document.getElementById('t-entregas');
  el.innerHTML = `
    <form class="card" id="f-entrega">
      <h2>Envíanos material</h2>
      <p class="sub">Sube tus archivos a Google Drive (o Dropbox, WeTransfer…), comparte la carpeta con permiso de ver y pega aquí la liga. Nos llega al instante.</p>
      <div class="fila">
        <div style="flex:0 0 200px"><label for="e-tipo">¿Qué nos mandas?</label>
          <select id="e-tipo">${Object.entries(TIPO_ENTREGA).map(([k, t]) => `<option value="${k}">${t}</option>`).join('')}</select></div>
        <div><label for="e-url">Liga de la carpeta o archivo</label><input id="e-url" type="url" placeholder="https://drive.google.com/…" required></div>
      </div>
      <label for="e-nota">Nota (opcional)</label>
      <textarea id="e-nota" placeholder="Ej. Videos 1 a 4 de los guiones de la semana 1"></textarea>
      <button class="btn negro" type="submit" style="margin-top:12px">Enviar a AbyC</button>
      <p class="msg oculto" id="e-msg"></p>
    </form>
    ${lista.length ? `<p class="grupo-t">Lo que nos has enviado</p><div class="lista">${lista.map(x => `<div class="item"><div class="txt">
      <h3>${esc(TIPO_ENTREGA[x.tipo] || 'Material')}</h3>
      ${x.nota ? `<p class="meta">${esc(x.nota)}</p>` : ''}
      <p class="meta">Enviado el ${fecha(x.creado_en)} · <a href="${esc(x.url)}" target="_blank" rel="noopener">abrir liga</a></p></div>
      <div class="acciones"><span class="chip ${x.estado === 'recibido' ? 'ok' : 'warn'}">${x.estado === 'recibido' ? 'Recibido por AbyC' : 'Enviado'}</span></div></div>`).join('')}</div>` : ''}`;
  el.querySelector('#f-entrega').onsubmit = async (ev) => {
    ev.preventDefault();
    const m = el.querySelector('#e-msg');
    if (DEMO) { Portal.aviso(m, 'Vista de ejemplo: aquí la liga le llega a AbyC.', 'ok'); return; }
    const b = ev.target.querySelector('button'); b.disabled = true;
    const { error } = await sb.from('entregas').insert({
      cliente_id: D.clienteId, tipo: el.querySelector('#e-tipo').value,
      url: el.querySelector('#e-url').value.trim(), nota: el.querySelector('#e-nota').value.trim() || null
    });
    b.disabled = false;
    if (error) { Portal.aviso(m, 'No se pudo enviar. Revisa que la liga empiece con https://', 'mal'); return; }
    Portal.aviso(m, '¡Listo! Ya nos llegó tu liga.', 'ok');
    setTimeout(cargar, 900);
  };
}

/* ---------- materiales y reportes ---------- */
function pintarArchivos(lista) {
  const fila = (x, titulo) => `<div class="item"><div class="txt"><h3>${esc(titulo)}</h3>
      ${x.descripcion ? `<p class="meta">${esc(x.descripcion)}</p>` : ''}
      <p class="meta">Subido el ${fecha(x.creado_en)}</p></div>
      <div class="acciones"><button class="btn chico" data-d="${esc(x.ruta)}">Descargar</button></div></div>`;
  const mats = lista.filter(x => x.tipo === 'material');
  const reps = lista.filter(x => x.tipo === 'reporte').sort((a, b) => String(b.mes).localeCompare(String(a.mes)));
  document.getElementById('t-materiales').innerHTML = mats.length
    ? `<div class="lista">${mats.map(x => fila(x, x.titulo)).join('')}</div>`
    : '<div class="vacio">Aquí vas a encontrar tus videos, diseños, guiones y tu estrategia.</div>';
  document.getElementById('t-reportes').innerHTML = reps.length
    ? `<div class="lista">${reps.map(x => fila(x, x.mes ? 'Reporte de ' + mes(x.mes) : x.titulo)).join('')}</div>`
    : '<div class="vacio">Tu primer reporte mensual aparecerá aquí.</div>';
  ['t-materiales', 't-reportes'].forEach(id =>
    document.getElementById(id).querySelectorAll('[data-d]').forEach(b => b.onclick = () => abrirArchivo(b.dataset.d)));
}

cargar();
</script>
</body>
</html>
