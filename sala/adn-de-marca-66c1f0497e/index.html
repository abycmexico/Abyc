<style>
/* Los mismos tokens que el resto de abycagency.com. */
:root{
  --yellow:#FFCC33; --yellow-soft:#FFE38A; --ink:#111111; --gray:#6e6e6e;
  --line:#ececec; --crema:#FFF9EC; --bg:#fff; --soft:#FAF9F6; --hl:#FFF4D1;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--ink);font-family:'Montserrat',Arial,sans-serif;font-weight:500;line-height:1.55;font-size:16px;display:flex;flex-direction:column;min-height:100vh;}
button{font:inherit;color:inherit;cursor:pointer;}
input,textarea{font:inherit;color:inherit;}

/* ---------- barra superior ---------- */
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1.5px solid var(--line);}
.top .in{max-width:760px;margin:0 auto;padding:14px 20px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
/* Logo oficial, igual que la cabecera de abycagency.com: abeja + ABYC. */
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px;letter-spacing:1px;color:var(--ink);text-decoration:none;}
.logo img{height:28px;width:auto;}
.seccion{font-size:11.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--gray);text-align:right;}
.avance{height:4px;background:var(--line);}
.avance i{display:block;height:100%;width:0;background:var(--yellow);transition:width .35s ease;}

/* ---------- pantalla ---------- */
main{flex:1;display:flex;}
.pantalla{max-width:760px;width:100%;margin:0 auto;padding:44px 20px 140px;animation:entra .35s ease;}
@keyframes entra{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.num{font-size:12px;font-weight:800;letter-spacing:1.5px;color:var(--gray);text-transform:uppercase;margin-bottom:12px;}
h1{font-size:clamp(32px,6vw,52px);font-weight:900;line-height:1.05;letter-spacing:-1px;margin-bottom:18px;}
h1 span{background:linear-gradient(transparent 62%,var(--yellow) 62%);}
h2{font-size:clamp(22px,3.8vw,30px);font-weight:800;line-height:1.2;letter-spacing:-.4px;margin-bottom:10px;}
.ayuda{color:var(--gray);font-size:15px;margin-bottom:24px;}
.lead{font-size:18px;color:#333;margin-bottom:16px;max-width:620px;}
.lista-intro{list-style:none;margin:26px 0 30px;display:grid;gap:12px;}
.lista-intro li{display:flex;gap:12px;align-items:flex-start;font-size:15.5px;}
.lista-intro li::before{content:"";flex:none;width:10px;height:10px;margin-top:7px;background:var(--yellow);}
.nota{font-size:13px;color:var(--gray);margin-top:22px;}

/* ---------- campos ---------- */
.campo{width:100%;border:none;border-bottom:2px solid var(--line);padding:10px 2px;font-size:20px;font-weight:600;background:transparent;outline:none;transition:border-color .2s;}
.campo:focus{border-color:var(--yellow);}
textarea.campo{font-size:17px;font-weight:500;line-height:1.5;border:2px solid var(--line);border-radius:12px;padding:14px;min-height:150px;resize:vertical;}
textarea.campo:focus{border-color:var(--yellow);}
.trampa{position:absolute;left:-9999px;width:1px;height:1px;opacity:0;}

/* ---------- opciones ---------- */
.ops{display:grid;gap:10px;}
.ops.dos{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));}
.op{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:12px;padding:14px 16px;font-size:16px;font-weight:600;transition:border-color .15s,background .15s,transform .1s;}
.op:hover{border-color:var(--yellow-soft);background:var(--soft);}
.op:active{transform:scale(.99);}
.op .k{flex:none;width:26px;height:26px;border:1.5px solid #cfcfcf;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--gray);background:#fff;}
.op[aria-pressed="true"]{border-color:var(--yellow);background:var(--hl);}
.op[aria-pressed="true"] .k{background:var(--yellow);border-color:var(--yellow);color:var(--ink);}
.op[disabled]{opacity:.4;cursor:not-allowed;}
.limite{font-size:13px;font-weight:700;color:var(--gray);margin:-12px 0 16px;}

/* escala */
.escala{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.escala .op{justify-content:center;padding:16px 0;font-size:18px;font-weight:800;}
.polos{display:flex;justify-content:space-between;gap:16px;margin-top:10px;font-size:13.5px;font-weight:700;color:var(--gray);}
.polos span:last-child{text-align:right;}
.escala-bloque+.escala-bloque{margin-top:30px;}
.escala-bloque h3{font-size:15px;font-weight:800;margin-bottom:10px;}

/* colores */
.colores{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;}
.color{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:13px;font-weight:700;}
.color i{width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(0,0,0,.12);}
.color[aria-pressed="true"]{border-color:var(--ink);background:var(--hl);}
.color[disabled]{opacity:.4;cursor:not-allowed;}

/* tipografias */
.letra{font-size:22px !important;}

/* ---------- navegación ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,#fff 30%);padding:28px 20px 20px;z-index:4;}
.nav .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center;}
.btn{border:none;border-radius:12px;padding:15px 26px;font-size:16px;font-weight:800;background:var(--yellow);transition:transform .1s,opacity .2s;}
.btn:hover{transform:translateY(-1px);}
.btn[disabled]{opacity:.35;cursor:not-allowed;transform:none;}
.btn.sec{background:#fff;border:2px solid var(--line);color:var(--gray);}
.btn.negro{background:var(--ink);color:#fff;}
.nav .pista{margin-left:auto;font-size:12.5px;color:var(--gray);font-weight:600;}
.oculto{display:none !important;}

/* ---------- resultado ---------- */
.res-arq{border:2px solid var(--ink);border-radius:18px;padding:28px 24px;margin:26px 0 22px;background:var(--crema);}
.res-arq .eti{font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray);}
.res-arq h2{font-size:clamp(30px,5vw,42px);font-weight:900;margin:6px 0 4px;}
.res-arq .lema{font-size:18px;font-weight:700;margin-bottom:14px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px;}
.chips span{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:700;}
.cita{font-size:clamp(20px,3.4vw,26px);font-weight:800;line-height:1.3;border-left:6px solid var(--yellow);padding:6px 0 6px 18px;margin:28px 0;}
.sigue{background:var(--soft);border-radius:14px;padding:22px;margin-top:10px;}
.sigue h3{font-size:16px;font-weight:800;margin-bottom:10px;}
.sigue ul{list-style:none;display:grid;gap:8px;}
.sigue li{padding-left:22px;position:relative;font-size:15px;}
.sigue li::before{content:"→";position:absolute;left:0;font-weight:800;}
.estado{margin-top:22px;font-size:14px;font-weight:700;padding:12px 14px;border-radius:10px;background:var(--soft);}
.estado.ok{background:#EAF7EE;color:#1d6b35;}
.estado.mal{background:#FDECEC;color:#8a1f1f;}
.estado a{color:inherit;font-weight:800;}

@media (max-width:560px){
  .pantalla{padding-top:30px;}
  .escala .op{padding:13px 0;font-size:16px;}
  .op{padding:13px 14px;font-size:15px;}
  .nav .pista{display:none;}
  .btn{flex:1;}
  .btn.sec{flex:none;}
}
</style>
</head>

const LETRAS = ["Georgia,'Times New Roman',serif","'Montserrat',Arial,sans-serif","'Arial Black','Montserrat',sans-serif","'Snell Roundhand','Segoe Script','Brush Script MT',cursive"];

/* ---------- pantallas en orden ---------- */
const PANTALLAS = [{tipo:'bienvenida'}];
SECCIONES.forEach((s,si)=>{
  PANTALLAS.push({tipo:'intro',si});
  s.q.forEach(q=>PANTALLAS.push({tipo:'pregunta',si,q}));
});
PANTALLAS.push({tipo:'resultado'});
const TOTAL_Q = PANTALLAS.filter(p=>p.tipo==='pregunta').length;

/* ---------- estado (se guarda en este navegador) ---------- */
let E = {r:{}, i:0, inicio:null, enviado:false, trampa:''};
try{ const g = JSON.parse(localStorage.getItem(LLAVE)||'null'); if(g && g.r) E = Object.assign(E,g); }catch(e){}
function guardar(){ try{ localStorage.setItem(LLAVE, JSON.stringify(E)); }catch(e){} }

const $ = s=>document.querySelector(s);
const pantalla=$('#pantalla'), btnSig=$('#siguiente'), btnAtras=$('#atras'), nav=$('#nav');
const esc = t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function respondida(q){
  const v = E.r[q.id];
  if(q.tipo==='voz') return q.escalas.every(e=>E.r[e.id]);
  if(Array.isArray(v)) return v.length>0;
  if(q.tipo==='email') return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v||'');
  if(q.tipo==='tel') return (v||'').replace(/\D/g,'').length>=10;
  return v!==undefined && String(v).trim()!=='';
}
function listo(p){ return p.tipo!=='pregunta' || p.q.opc || respondida(p.q); }

function pintar(){
  const p = PANTALLAS[E.i];
  const hechas = PANTALLAS.slice(0,E.i).filter(x=>x.tipo==='pregunta').length;
  $('#barra').style.width = (p.tipo==='resultado'?100:Math.round(hechas/TOTAL_Q*100))+'%';
  $('#seccion').textContent = (p.si!==undefined) ? `${p.si+1} de ${SECCIONES.length} · ${SECCIONES[p.si].nombre}` : '';
  pantalla.innerHTML=''; pantalla.style.animation='none'; void pantalla.offsetWidth; pantalla.style.animation='';
  nav.classList.toggle('oculto', p.tipo==='resultado');
  btnAtras.classList.toggle('oculto', E.i===0);
  ({bienvenida, intro, pregunta, resultado})[p.tipo](p);
  actualizarNav();
  window.scrollTo(0,0);
}

function actualizarNav(){
  const p = PANTALLAS[E.i];
  btnSig.disabled = !listo(p);
  const ultima = E.i===PANTALLAS.length-2;
  btnSig.textContent = p.tipo==='bienvenida' ? (Object.keys(E.r).length?'Continuar':'Empezar') : p.tipo==='intro' ? 'Vamos' : ultima ? 'Terminar y enviar' : (p.q && p.q.opc && !respondida(p.q) ? 'Saltar' : 'Siguiente');
  btnSig.classList.toggle('negro', ultima);
}

function ir(d){
  if(d>0 && !listo(PANTALLAS[E.i])) return;
  E.i = Math.max(0, Math.min(PANTALLAS.length-1, E.i+d));
  if(!E.inicio && E.i>0) E.inicio = Date.now();
  guardar(); pintar();
}
btnSig.onclick=()=>ir(1);
btnAtras.onclick=()=>ir(-1);
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter' || e.shiftKey || e.target.tagName==='TEXTAREA' || e.target.tagName==='BUTTON') return;
  e.preventDefault(); if(!btnSig.disabled && !nav.classList.contains('oculto')) btnSig.click();
});

/* ---------- pantallas ---------- */
function bienvenida(){
  const retomar = Object.keys(E.r).length>0;
  pantalla.innerHTML = `
    <div class="num">AbyC · Marca personal</div>
    <h1>Tu <span>ADN de Marca</span> Personal</h1>
    <p class="lead">Antes de diseñar tu marca necesitamos conocerte de verdad: tu historia, tu forma de ser, a dónde quieres llegar y cómo te ves.</p>
    <ul class="lista-intro">
      <li>Son ${TOTAL_Q} preguntas en ${SECCIONES.length} partes. Te toma de 30 a 40 minutos.</li>
      <li>La mayoría son de opción múltiple; unas pocas te piden escribir con tus palabras.</li>
      <li>Se guarda solo en este dispositivo: puedes cerrar y volver después a esta misma liga.</li>
      <li>Al final verás tu arquetipo de marca. El análisis completo te lo entregamos en tu sesión.</li>
    </ul>
    ${retomar?'<p class="lead"><b>Ya habías empezado.</b> Te llevamos a donde te quedaste.</p><button class="btn sec" type="button" id="reiniciar" style="margin-top:4px">Empezar de cero</button>':''}
    <input class="trampa" id="trampa" tabindex="-1" autocomplete="off" aria-hidden="true">
    <p class="nota">Tus respuestas solo las ve el equipo de AbyC y se usan únicamente para construir tu marca.</p>`;
  $('#trampa').oninput=e=>{E.trampa=e.target.value;};
  if(retomar){
    $('#reiniciar').onclick=()=>{ if(confirmarReinicio()){ E={r:{},i:0,inicio:null,enviado:false,trampa:''}; guardar(); pintar(); } };
    btnSig.onclick=()=>{ btnSig.onclick=()=>ir(1); const k=E.ultima||1; E.i=Math.min(k,PANTALLAS.length-2); guardar(); pintar(); };
  }else btnSig.onclick=()=>ir(1);
}
function confirmarReinicio(){
  const b=$('#reiniciar');
  if(b.dataset.ok) return true;
  b.dataset.ok=1; b.textContent='¿Seguro? Se borran tus respuestas. Toca otra vez'; return false;
}

function intro(p){
  const s=SECCIONES[p.si];
  pantalla.innerHTML = `<div class="num">Parte ${p.si+1} de ${SECCIONES.length}</div><h1>${esc(s.intro.t)}</h1><p class="lead">${esc(s.intro.p)}</p>`;
}

function pregunta(p){
  const q=p.q;
  E.ultima=E.i;
  const n = PANTALLAS.slice(0,E.i+1).filter(x=>x.tipo==='pregunta').length;
  let h = `<div class="num">Pregunta ${n} de ${TOTAL_Q}${q.opc?' · opcional':''}</div><h2>${esc(q.t)}</h2>`;
  h += q.ayuda ? `<p class="ayuda">${esc(q.ayuda)}</p>` : '<div style="height:18px"></div>';
  pantalla.innerHTML = h;
  const v = E.r[q.id];

  if(['texto','email','tel'].includes(q.tipo)){
    const i=document.createElement('input');
    i.className='campo'; i.type=q.tipo==='texto'?'text':q.tipo; i.value=v||'';
    if(q.tipo==='email') i.autocomplete='email';
    if(q.tipo==='tel'){i.autocomplete='tel'; i.inputMode='tel';}
    if(q.id==='nombre') i.autocomplete='name';
    i.placeholder='Escribe aquí';
    i.oninput=()=>{E.r[q.id]=i.value; guardar(); actualizarNav();};
    pantalla.appendChild(i); setTimeout(()=>i.focus(),50);
  }
  else if(q.tipo==='largo'){
    const t=document.createElement('textarea');
    t.className='campo'; t.value=v||''; t.placeholder='Escribe con tus palabras...';
    t.oninput=()=>{E.r[q.id]=t.value; guardar(); actualizarNav();};
    pantalla.appendChild(t); setTimeout(()=>t.focus(),50);
  }
  else if(q.tipo==='una' || q.tipo==='arq'){
    const ops=document.createElement('div'); ops.className='ops';
    q.ops.forEach((o,k)=>{
      const txt = q.tipo==='arq'?o[0]:o;
      const b=document.createElement('button'); b.type='button'; b.className='op';
      b.innerHTML=`<span class="k">${String.fromCharCode(65+k)}</span><span>${esc(txt)}</span>`;
      if(q.letras){ b.lastChild.style.fontFamily=LETRAS[k]; b.lastChild.classList.add('letra'); }
      b.setAttribute('aria-pressed', v===txt);
      b.onclick=()=>{
        E.r[q.id]=txt; guardar();
        ops.querySelectorAll('.op').forEach(x=>x.setAttribute('aria-pressed',x===b));
        actualizarNav(); setTimeout(()=>ir(1),260);
      };
      ops.appendChild(b);
    });
    pantalla.appendChild(ops);
  }
  else if(q.tipo==='varias' || q.tipo==='color'){
    if(q.max){ const l=document.createElement('p'); l.className='limite'; l.textContent=`Elige hasta ${q.max}.`; if(q.ayuda) pantalla.querySelector('.ayuda').after(l); else pantalla.appendChild(l); }
    const sel = Array.isArray(v)?v.slice():[];
    const caja=document.createElement('div');
    caja.className = q.tipo==='color' ? 'colores' : 'ops'+(q.dos?' dos':'');
    const lista = q.tipo==='color' ? COLORES : q.ops.map(o=>[o]);
    const botones=[];
    const refrescar=()=>{
      botones.forEach(([b,val])=>{
        const on=sel.includes(val); b.setAttribute('aria-pressed',on);
        b.disabled = !on && q.max && sel.length>=q.max;
      });
    };
    lista.forEach(([val,hex],k)=>{
      const b=document.createElement('button'); b.type='button';
      if(q.tipo==='color'){ b.className='color'; b.innerHTML=`<i style="background:${hex}"></i>${esc(val)}`; }
      else { b.className='op'; b.innerHTML=`<span class="k">✓</span><span>${esc(val)}</span>`; }
      b.onclick=()=>{
        const j=sel.indexOf(val);
        if(j>=0) sel.splice(j,1);
        else{
          // "Ninguno" / "Ninguna" excluye a las demás opciones
          const excl=/^Ningun|^Todavía no|^No sé/;
          if(excl.test(val)) sel.length=0; else for(let x=sel.length-1;x>=0;x--) if(excl.test(sel[x])) sel.splice(x,1);
          if(!q.max || sel.length<q.max) sel.push(val);
        }
        E.r[q.id]=sel.slice(); guardar(); refrescar(); actualizarNav();
      };
      botones.push([b,val]); caja.appendChild(b);
    });
    refrescar();
    pantalla.appendChild(caja);
  }
  else if(q.tipo==='escala'){
    pantalla.appendChild(bloqueEscala(q.id, q.polos, null));
  }
  else if(q.tipo==='voz'){
    q.escalas.forEach(e=>pantalla.appendChild(bloqueEscala(e.id, e.polos, true)));
  }
}

function bloqueEscala(id, polos, varias){
  const w=document.createElement('div'); w.className='escala-bloque';
  const g=document.createElement('div'); g.className='escala';
  for(let n=1;n<=5;n++){
    const b=document.createElement('button'); b.type='button'; b.className='op'; b.textContent=n;
    b.setAttribute('aria-pressed', E.r[id]===n);
    b.onclick=()=>{
      E.r[id]=n; guardar();
      g.querySelectorAll('.op').forEach(x=>x.setAttribute('aria-pressed',x===b));
      actualizarNav();
      if(!varias) setTimeout(()=>ir(1),260);
    };
    g.appendChild(b);
  }
  w.appendChild(g);
  const pl=document.createElement('div'); pl.className='polos';
  pl.innerHTML=`<span>← ${esc(polos[0])}</span><span>${esc(polos[1])} →</span>`;
  w.appendChild(pl);
  return w;
}

/* ---------- cálculo del arquetipo ---------- */
function puntajes(){
  const pts={}, max={};
  Object.keys(ARQ).forEach(k=>{pts[k]=0;max[k]=0;});
  SECCIONES.forEach(s=>s.q.forEach(q=>{
    if(q.tipo!=='arq') return;
    q.ops.forEach(o=>max[o[1]]++);
    const o=q.ops.find(o=>o[0]===E.r[q.id]);
    if(o) pts[o[1]]++;
  }));
  return Object.keys(ARQ).map(k=>({k, pct:max[k]?Math.round(pts[k]/max[k]*100):0, pts:pts[k]}))
    .sort((a,b)=>b.pct-a.pct || b.pts-a.pts);
}
function resumenVoz(){
  const t=(id,a,b)=>{const v=E.r[id]; return v<=2?a:v>=4?b:null;};
  return [t('v_formal','formal','relajada'),t('v_humor','seria','con humor'),t('v_razon','con datos','emocional'),
    t('v_expr','reservada','expresiva'),t('v_clasico','clásica','vanguardista'),t('v_directo','diplomática','directa'),
    t('v_rol','de experto','de igual a igual')].filter(Boolean);
}

/* ---------- envío a Google Sheets ---------- */
function armarFilas(){
  const ranking=puntajes(), a=ARQ[ranking[0].k];
  const filas=[['Fecha', new Date().toLocaleString('es-MX',{timeZone:'America/Mexico_City'})],
    ['Minutos', E.inicio?Math.round((Date.now()-E.inicio)/60000):'']];
  SECCIONES.forEach(s=>s.q.forEach(q=>{
    if(q.tipo==='voz'){ q.escalas.forEach(e=>filas.push([e.col, E.r[e.id]||''])); return; }
    if(q.tipo==='arq') return;
    const v=E.r[q.id];
    filas.push([q.col, Array.isArray(v)?v.join(', '):(v??'')]);
  }));
  filas.push(['Arquetipo principal', a.nombre]);
  filas.push(['Arquetipo secundario', ARQ[ranking[1].k].nombre]);
  filas.push(['Arquetipo terciario', ARQ[ranking[2].k].nombre]);
  filas.push(['Puntajes de arquetipo', ranking.map(x=>`${ARQ[x.k].nombre} ${x.pct}%`).join(' · ')]);
  filas.push(['Voz (escalas)', resumenVoz().join(', ')]);
  filas.push(['Paleta sugerida', a.paleta.map(c=>`${c[0]} ${c[1]}`).join(', ')]);
  filas.push(['Respuestas de personalidad', SECCIONES.flatMap(s=>s.q.filter(q=>q.tipo==='arq').map(q=>`${q.id}: ${E.r[q.id]||''}`)).join(' | ')]);
  return filas;
}

async function enviar(estado){
  if(E.enviado){ estado.className='estado ok'; estado.textContent='Tus respuestas ya están con el equipo de AbyC.'; return; }
  if(!ENDPOINT){ estado.className='estado'; estado.textContent='(Modo de prueba: todavía no hay hoja conectada, las respuestas no se enviaron.)'; return; }
  estado.className='estado'; estado.textContent='Enviando tus respuestas...';
  try{
    // text/plain evita la verificación previa de CORS; Apps Script lee el cuerpo igual.
    await fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({filas:armarFilas(), trampa:E.trampa||''})});
    E.enviado=true; guardar();
    estado.className='estado ok'; estado.textContent='Listo. Tus respuestas ya están con el equipo de AbyC.';
  }catch(err){
    const msg=encodeURIComponent(`Hola AbyC, soy ${E.r.nombre||''}. Terminé el test ADN de Marca pero no se pudo enviar.`);
    estado.className='estado mal';
    estado.innerHTML=`No pudimos enviar tus respuestas (revisa tu conexión). Tus respuestas siguen guardadas aquí. <a href="#" id="reintentar">Intentar de nuevo</a> o <a href="https://wa.me/${WHATSAPP}?text=${msg}" target="_blank" rel="noopener">avísanos por WhatsApp</a>.`;
    $('#reintentar').onclick=e=>{e.preventDefault(); enviar(estado);};
  }
}

function resultado(){
  const r=puntajes(), a=ARQ[r[0].k], b=ARQ[r[1].k];
  const voz=resumenVoz();
  const nombre=(E.r.nombre||'').trim().split(/\s+/)[0];
  pantalla.innerHTML = `
    <div class="num">Tu resultado</div>
    <h1>${nombre?esc(nombre)+', así':'Así'} se ve tu <span>ADN</span></h1>
    <div class="res-arq">
      <div class="eti">Tu arquetipo de marca</div>
      <h2>${a.nombre}</h2>
      <div class="lema">${a.lema}</div>
      <p>${a.desc}</p>
      <div class="chips">${a.voz.concat(voz.slice(0,2)).filter((x,i,arr)=>arr.indexOf(x)===i).map(x=>`<span>Voz ${esc(x)}</span>`).join('')}</div>
    </div>
    <p class="ayuda" style="margin:0">Así podría sonar tu marca:</p>
    <div class="cita">“${a.frase}”</div>
    <p class="lead">Y tienes un toque de <b>${b.nombre}</b>: ${b.lema.charAt(0).toLowerCase()+b.lema.slice(1)}</p>
    <div class="sigue">
      <h3>Lo que sigue</h3>
      <ul>
        <li>Con tus respuestas armamos tu estrategia completa: tu paleta de colores, tus pilares de contenido, tu tono y tu biografía.</li>
        <li>Te la presentamos en tu sesión con el equipo de AbyC.</li>
      </ul>
    </div>
    <div class="estado" id="estado"></div>`;
  enviar($('#estado'));
}

// Si ya terminó, vuelve a ver su resultado; si no, entra por la bienvenida, que ofrece retomar.
if(E.i!==PANTALLAS.length-1) E.i=0;
pintar();
</script>
